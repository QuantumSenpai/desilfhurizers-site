<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="d-fill" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2F6FEF"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <!-- Near-black rounded-square background badge -->
  <rect width="64" height="64" rx="14" fill="#0B0F14"/>

  <!--
    Bold geometric "D" letterform.
    Built from a vertical left stroke + two arcs forming the bowl.
    Outer arc radius 20, inner arc radius 11, centered at x=16, y=32.
    Cap height from y=12 to y=52 (40px tall — maximum legibility).
  -->
  <path
    d="M16 12
       L16 52
       L28 52
       C41.255 52 50 43.941 50 32
       C50 20.059 41.255 12 28 12
       Z
       M16 12"
    fill="url(#d-fill)"
  />
  <!-- Inner cutout to form the bowl of the D, creating a clean letterform -->
  <path
    d="M22 19
       L28 19
       C36.837 19 43 24.477 43 32
       C43 39.523 36.837 45 28 45
       L22 45
       Z"
    fill="#0B0F14"
  />
</svg>